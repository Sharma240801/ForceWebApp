<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <defs>
    <linearGradient id="kBody" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F3F4F6" />
      <stop offset="85%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
    <linearGradient id="kGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <radialGradient id="kRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#111827" />
    </radialGradient>
  </defs>

  <ellipse cx="160" cy="102" rx="140" ry="8" fill="#000000" opacity="0.25" />

  <!-- Rear Wing Spoiler (Koenigsegg style tall dual mounts) -->
  <path d="M 35 48 L 22 24 L 28 22 L 42 46 Z" fill="#111827" />
  <path d="M 55 50 L 48 24 L 54 22 L 62 48 Z" fill="#111827" />
  <path d="M 18 24 C 30 20 60 19 80 23 L 78 26 C 58 23 30 23 18 27 Z" fill="#1F2937" stroke="#111827" />

  <!-- Body -->
  <path d="M 26 84 
           C 24 74 30 65 44 58 
           C 62 50 95 48 115 42 
           C 135 34 165 28 190 32 
           C 215 36 240 48 265 60 
           C 285 68 300 76 304 84 
           C 305 88 300 92 285 92 
           C 280 75 260 65 240 65 
           C 220 65 204 76 200 92 
           L 115 92 
           C 111 76 95 65 75 65 
           C 55 65 40 76 36 92 
           Z" fill="url(#kBody)" stroke="#9CA3AF" stroke-width="1" />

  <!-- Canopy / Cockpit (Bubble shape) -->
  <path d="M 105 45 C 125 32 155 26 182 30 C 205 34 225 45 235 52 L 195 50 L 115 50 Z" fill="url(#kGlass)" stroke="#111827" />
  <path d="M 140 33 L 144 48" stroke="#4B5563" stroke-width="2" />
  <path d="M 118 42 Q 155 30 195 35" stroke="#60A5FA" stroke-width="1.5" opacity="0.5" fill="none" />

  <!-- Carbon fiber accents & air intakes -->
  <path d="M 125 58 Q 150 56 180 58 L 175 75 Q 145 72 125 74 Z" fill="#1F2937" opacity="0.8" />
  <path d="M 270 70 L 295 76 L 290 82 L 265 76 Z" fill="#60A5FA" opacity="0.85" />
  <!-- Lower Carbon Splitter -->
  <rect x="30" y="90" width="265" height="3" fill="#111827" rx="1.5" />

  <!-- Rear Wheel -->
  <g transform="translate(75, 88)">
    <circle cx="0" cy="0" r="20" fill="#111827" />
    <circle cx="0" cy="0" r="13" fill="url(#kRim)" />
    <circle cx="0" cy="0" r="4" fill="#111827" />
    <path d="M -11 0 L 11 0 M 0 -11 L 0 11 M -7 -7 L 7 7 M -7 7 L 7 -7" stroke="#111827" stroke-width="2.5" />
    <circle cx="-5" cy="-3" r="3" fill="#F59E0B" />
  </g>

  <!-- Front Wheel -->
  <g transform="translate(240, 88)">
    <circle cx="0" cy="0" r="20" fill="#111827" />
    <circle cx="0" cy="0" r="13" fill="url(#kRim)" />
    <circle cx="0" cy="0" r="4" fill="#111827" />
    <path d="M -11 0 L 11 0 M 0 -11 L 0 11 M -7 -7 L 7 7 M -7 7 L 7 -7" stroke="#111827" stroke-width="2.5" />
    <circle cx="-5" cy="-3" r="3" fill="#F59E0B" />
  </g>
</svg>