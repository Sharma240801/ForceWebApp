<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <rect width="160" height="120" rx="10" fill="#0B0F19" />
  <!-- Windshield view with road lines -->
  <path d="M 10 10 L 150 10 L 140 45 L 20 45 Z" fill="#1E293B" />
  <path d="M 80 15 L 75 40 M 82 15 L 87 40" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3" />
  
  <!-- Dashboard panel -->
  <path d="M 0 55 C 40 48 120 48 160 55 L 160 120 L 0 120 Z" fill="#111827" />
  <path d="M 10 52 C 45 46 115 46 150 52" stroke="#374151" stroke-width="2" fill="none" />
  
  <!-- Steering Wheel -->
  <g transform="translate(48, 78)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1F2937" stroke-width="7" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#374151" stroke-width="2" />
    <circle cx="0" cy="0" r="12" fill="#111827" stroke="#4B5563" stroke-width="1.5" />
    <!-- Center Emblem -->
    <circle cx="0" cy="0" r="5" fill="#DC2626" />
    <!-- Spokes -->
    <path d="M -24 0 L -12 0 M 24 0 L 12 0 M 0 12 L 0 25" stroke="#4B5563" stroke-width="4" />
  </g>

  <!-- Digital Center Display / Infotainment -->
  <rect x="92" y="55" width="46" height="28" rx="3" fill="#0284C7" opacity="0.2" stroke="#38BDF8" stroke-width="1" />
  <path d="M 96 68 L 108 62 L 122 72 L 132 64" fill="none" stroke="#38BDF8" stroke-width="2" />
  <circle cx="122" cy="72" r="2.5" fill="#F43F5E" />
  
  <!-- AC vents & buttons -->
  <rect x="94" y="88" width="18" height="6" rx="1.5" fill="#1F2937" stroke="#374151" />
  <rect x="116" y="88" width="18" height="6" rx="1.5" fill="#1F2937" stroke="#374151" />
  
  <!-- Carbon Fiber Accent -->
  <path d="M 0 105 L 160 105 L 160 120 L 0 120 Z" fill="#0F172A" />
  <rect x="95" y="100" width="12" height="16" rx="2" fill="#374151" />
</svg>